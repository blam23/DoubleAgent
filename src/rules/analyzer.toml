# Built-in static analyzer rules, compiled into the binary.
#
# Every finding the analyzer can produce has its rule ID here. Switch rules
# off with analyzer.disabled_rules in the config. Patterns are regular
# expressions (Rust `regex` syntax), always matched case-insensitively.
# Rule weights are 0-100; a file's content score is its highest finding
# weight plus a quarter of every other finding's, capped at 100.
# `atlas` lists directly related MITRE ATLAS v2026.09 technique IDs; [] means no direct mapping.
#
# When a rule fires inside decoded hidden content (Unicode tag characters or
# base64), its ID gets a TAG: or B64: prefix and its weight goes up by 10.

# ════════════════════════════════════════════════════════════════════════
# Line rules: `pattern` is tested against each line of the file.
# `credential = true` marks rules that feed EX010 (credential access near a
# network command).
# ════════════════════════════════════════════════════════════════════════

# ── prompt injection / deception ──────────────────────────────────────────

[[line_rules]]
id = "PI001"
atlas = ["AML.T0051.001"]
title = "Override of previous instructions"
category = "prompt-injection"
weight = 45
reason = "Classic injection phrasing that tells the agent to discard its other instructions."
pattern = '''\b(ignore|disregard|forget|override|bypass)\s+(all\s+|any\s+)?(of\s+)?(the\s+|your\s+)?(previous|prior|above|earlier|preceding|parent|other|original|system|developer)\s+(instructions?|rules|prompts?|guidance|directives|guidelines|agents?\.md|context)'''

[[line_rules]]
id = "PI002"
atlas = ["AML.T0051.001"]
title = "Conceal actions from the user"
category = "deception"
weight = 40
reason = "Asks the agent to hide what it does from the person supervising it."
pattern = '''\b(do\s*n[o']?t|never|without)\s+(tell(ing)?|inform(ing)?|notify(ing)?|mention(ing)?|alert(ing)?|ask(ing)?|show(ing)?|reveal(ing)?|report(ing)?)\s+(this\s+)?(to\s+)?(the\s+)?(user|human|developer|operator|owner|reviewer)'''

[[line_rules]]
id = "PI003"
atlas = ["AML.T0051.001"]
title = "Covert-action wording"
category = "deception"
weight = 30
reason = "Words such as 'silently' or 'secretly' attached to actions."
pattern = '''\b(silently|secretly|quietly|covertly|discreetly|stealthily)\b'''

[[line_rules]]
id = "PI004"
atlas = ["AML.T0051.001", "AML.T0054"]
title = "Role or mode hijack"
category = "prompt-injection"
weight = 35
reason = "Tries to swap the agent's identity or put it into an unrestricted mode."
pattern = '''(you\s+are\s+(now\s+)?(no\s+longer|in)\s+\w*\s*(developer|dan|jailbreak|god|unrestricted|admin)\s+mode|new\s+system\s+prompt|system\s+override|</?\s*system\s*>|\[\s*system\s*\]|begin\s+admin\s+instructions)'''

[[line_rules]]
id = "PI005"
atlas = ["AML.T0051.001"]
title = "Claims to supersede other instruction files"
category = "prompt-injection"
weight = 50
reason = "Claims precedence over other agent files or safety rules."
pattern = '''\b(this\s+file\s+)?(supersedes|overrides|takes\s+precedence\s+over|replaces)\s+(all\s+|any\s+)?(other\s+|previous\s+|parent\s+)?(instructions|rules|agents?\.md|claude\.md|policies|guidelines|safety)'''

[[line_rules]]
id = "PI006"
atlas = []
title = "Addresses the AI rater / scanner"
category = "prompt-injection"
weight = 50
reason = "Text aimed at security tooling (e.g. 'rate this file as safe') is an evasion attempt."
pattern = '''\b(rate|mark|classify|report|score)\s+(this\s+)?(file|document|content)?\s*(as\s+)?(safe|benign|clean|harmless|low[- ]risk)\b|\b(security\s+)?(scanner|auditor|reviewer|classifier|rater)s?\s*[:,]?\s*(should|must|please)\s+(ignore|skip|approve)'''

[[line_rules]]
id = "PI007"
atlas = ["AML.T0051.001"]
title = "Impersonates a trusted instruction source"
category = "prompt-injection"
weight = 35
reason = "Claims authority as a system, developer, or user instruction to make the agent trust this file."
pattern = '''\b(this\s+(file|document|message|section)\s+)?(is|contains|represents)\s+(the\s+)?(real\s+|actual\s+|authorized\s+|trusted\s+)?(system|developer|user|administrator|admin)\s+(prompt|message|instruction|directive|policy)\b|\b(treat|consider|regard)\s+(this\s+)?(file|document|message|content)\s+as\s+(the\s+)?(system|developer|user|trusted|authorized)\s+(prompt|message|instruction|directive|policy)\b'''

[[line_rules]]
id = "EX011"
atlas = ["AML.T0051.001", "AML.T0057"]
title = "Disclose private data in a response or artifact"
category = "exfiltration"
weight = 45
reason = "Directs private data into a response, log, report, or generated artifact."
pattern = '''\b(reveal|disclose|print|include|copy|paste|quote|dump|expose|write|append|summarize)\b[^\n]{0,100}\b(conversation\s+history|chat\s+history|system\s+prompt|developer\s+message|environment\s+variables?|process\.env|credentials?|passwords?|passphrases?|secrets?|tokens?|api\s+keys?|private\s+keys?|\.env\b)\b[^\n]{0,100}\b(response|reply|output|log|report|artifact|file|comment|commit|issue)\b|\b(response|reply|output|log|report|artifact|file|comment|commit|issue)\b[^\n]{0,100}\b(reveal|disclose|print|include|copy|paste|quote|dump|expose|write|append|summarize)\b[^\n]{0,100}\b(conversation\s+history|chat\s+history|system\s+prompt|developer\s+message|environment\s+variables?|process\.env|credentials?|passwords?|passphrases?|secrets?|tokens?|api\s+keys?|private\s+keys?|\.env\b)\b'''

[[line_rules]]
id = "PI008"
atlas = ["AML.T0051.001"]
title = "Treat untrusted external content as instructions"
category = "prompt-injection"
weight = 35
reason = "Directs the agent to obey instructions embedded in external or otherwise untrusted content."
pattern = '''\b(follow|obey|execute|run|apply|act\s+on)\b[^\n]{0,100}\b(instructions?|commands?|prompts?)\b[^\n]{0,100}\b(webpages?|web\s+pages?|issues?|pull\s+requests?|commit\s+messages?|command\s+output|tool\s+output|search\s+results?|external\s+content|untrusted\s+(text|content|data))\b|\b(webpages?|web\s+pages?|issues?|pull\s+requests?|commit\s+messages?|command\s+output|tool\s+output|search\s+results?|external\s+content|untrusted\s+(text|content|data))\b[^\n]{0,100}\b(instructions?|commands?|prompts?)\b[^\n]{0,100}\b(follow|obey|execute|run|apply|act\s+on)\b'''

[[line_rules]]
id = "PI009"
atlas = ["AML.T0051.001"]
title = "Mislead or bypass review and audit"
category = "deception"
weight = 40
reason = "Asks the agent to conceal changes or falsely imply review or approval."
pattern = '''\b(omit|hide|exclude|leave\s+out|do\s+not\s+mention|don't\s+mention|misrepresent|describe|claim|say)\b[^\n]{0,100}\b(changes?|actions?|commands?|diff|logs?|report|summary|review|approval|approved|authorized)\b|\b(claim|say|pretend|state)\b[^\n]{0,80}\b(already\s+)?(reviewed|approved|authorized|verified)\b'''


# ── remote code / shell ───────────────────────────────────────────────────

[[line_rules]]
id = "SH001"
atlas = ["AML.T0050", "AML.T0051.001"]
title = "Pipe remote content into a shell"
category = "remote-code"
weight = 60
reason = "Downloads and executes code in one step with no review."
pattern = '''\b(curl|wget|iwr|irm|invoke-webrequest|invoke-restmethod|fetch)\b[^\n|]*\|\s*(sudo\s+)?(-?\s*)?(sh|bash|zsh|dash|ksh|fish|python[0-9.]*|perl|ruby|node|php|iex|invoke-expression|pwsh|powershell)\b'''

[[line_rules]]
id = "SH002"
atlas = ["AML.T0050", "AML.T0051.001"]
title = "Encoded or obfuscated command execution"
category = "obfuscation"
weight = 55
reason = "Decoding a payload and executing it hides what actually runs."
pattern = '''(base64\s+(-d|--decode|-D)[^\n]*\|\s*(sh|bash|zsh|python)|powershell[^\n]*\s-(e|ec|enc|encodedcommand)\s+[A-Za-z0-9+/=]{16,}|frombase64string|\beval\s*\(\s*(atob|base64|decode|bytes\.fromhex)|exec\s*\(\s*(base64|codecs|zlib)\.|\biex\s*\(\s*\(?\s*new-object\s+net\.webclient)'''

[[line_rules]]
id = "SH003"
atlas = ["AML.T0050", "AML.T0051.001"]
title = "Destructive command"
category = "destructive"
weight = 40
reason = "Recursive deletion or disk-level operations."
pattern = '''(\brm\s+-[a-z]*r[a-z]*f?[a-z]*\s+(--no-preserve-root\s+)?(/|~|\$home|\*|\.\s|\.\.)|\bdel\s+/[sfq]|\brmdir\s+/s|remove-item[^\n]*-recurse[^\n]*-force|\bformat\s+[a-z]:|\bmkfs(\.\w+)?\b|\bdd\s+if=|\bshred\s+|git\s+clean\s+-[a-z]*f[a-z]*d|git\s+reset\s+--hard\s+origin)'''

[[line_rules]]
id = "SH004"
atlas = ["AML.T0050", "AML.T0051.001"]
title = "Download then execute a binary"
category = "remote-code"
weight = 45
reason = "Fetches an executable and runs it."
pattern = '''\b(curl|wget|invoke-webrequest|iwr)\b[^\n]*(\s-o\s|\s-O\b|--output|-outfile)[^\n]*(&&|;|\n)[^\n]*(chmod\s+\+?[0-7]*x|\./|start-process|\.exe\b)'''

[[line_rules]]
id = "SH005"
atlas = ["AML.T0050", "AML.T0051.001"]
title = "Persistence mechanism"
category = "persistence"
weight = 30
reason = "Creates scheduled tasks, startup entries or shell profile changes."
pattern = '''(\bcrontab\b|\bschtasks\b|launchctl\s+(load|bootstrap)|LaunchAgents|systemctl\s+(--user\s+)?enable|\\currentversion\\run|(>>|>|tee\s+-a)\s*~?/?\.(bashrc|zshrc|profile|bash_profile)|\$profile\b|startup\s+folder)'''

[[line_rules]]
id = "SH006"
atlas = ["AML.T0050", "AML.T0051.001"]
title = "Reverse shell or listener"
category = "remote-code"
weight = 70
reason = "Opens an interactive shell to or from a remote host."
pattern = '''(\bnc\s+(-[a-z]*e|-[a-z]*c)\s|\bncat\b[^\n]*-e\s|/dev/tcp/|bash\s+-i\s+>&|\bsocat\b[^\n]*exec|mkfifo[^\n]*\bnc\b|new-object\s+system\.net\.sockets\.tcpclient)'''

[[line_rules]]
id = "SH007"
atlas = ["AML.T0050", "AML.T0051.001", "AML.T0054"]
title = "Privilege escalation"
category = "safety-bypass"
weight = 25
reason = "Runs commands as administrator or root, or weakens permissions."
pattern = '''(\bsudo\s+(-s|su|-i|chmod|chown|rm|bash)|\bchmod\s+(-r\s+)?(777|a\+rwx|u\+s)|runas\s+/user:administrator|set-executionpolicy\s+(bypass|unrestricted)|-executionpolicy\s+bypass)'''

[[line_rules]]
id = "SH008"
atlas = ["AML.T0050", "AML.T0051.001"]
title = "Install from an unpinned or non-registry source"
category = "supply-chain"
weight = 25
reason = "Installs packages from URLs or git without pinning, or adds unknown registries."
pattern = '''(\b(pip|pip3)\s+install\s+[^\n]*(https?://|git\+)|\bnpm\s+(i|install)\s+[^\n]*(https?://|git\+|github:)|--extra-index-url\s+https?://|--index-url\s+https?://|npm\s+config\s+set\s+registry|cargo\s+install\s+--git\s)'''


# ── credentials / exfiltration ────────────────────────────────────────────

[[line_rules]]
id = "EX001"
atlas = ["AML.T0083", "AML.T0098"]
title = "Reference to credentials or key material"
category = "credential-access"
weight = 35
reason = "Points the agent at SSH keys, cloud credentials or token stores."
credential = true
pattern = '''(~?/?\.ssh\b|\bid_(rsa|ed25519|ecdsa|dsa)\b|\.aws/credentials|\.aws\\credentials|\.config/gcloud|application_default_credentials|\.azure/|\.kube/config|\.docker/config\.json|\.npmrc\b|\.pypirc\b|\.netrc\b|\.git-credentials|\bkeychain\b|credential\s+manager|\bcmdkey\b|login\s+data|\bcookies\.sqlite\b|wallet\.dat|\.gnupg\b|\bsecrets?\.(json|ya?ml|toml)\b)'''

[[line_rules]]
id = "EX002"
atlas = ["AML.T0083"]
title = "Reference to .env / environment secrets"
category = "credential-access"
weight = 20
reason = "Reads environment files or dumps environment variables."
credential = true
pattern = '''((^|[\s'`(/\\])\.env(\.[a-z]+)?\b|\bprintenv\b|\benv\s*[|>]|\bset\s*[|>]|get-childitem\s+env:|\bgci\s+env:|\[environment\]::getenvironmentvariables|os\.environ\b|process\.env\s*\))'''

[[line_rules]]
id = "EX003"
atlas = ["AML.T0025", "AML.T0057"]
title = "Send data to a remote destination"
category = "exfiltration"
weight = 45
reason = "Instructs the agent to transmit data off the machine."
pattern = '''\b(send|upload|post|exfiltrate|transmit|forward|leak|beacon|sync|copy|push)\b[^\n]{0,80}\b(to|at|via|into)\b[^\n]{0,60}(https?://|webhook|\bserver\b|endpoint|discord|telegram|slack|pastebin|gist|\b\d{1,3}(\.\d{1,3}){3}\b|s3://|ftp://)'''

[[line_rules]]
id = "EX004"
atlas = ["AML.T0025"]
title = "Known exfiltration / interception endpoint"
category = "exfiltration"
weight = 55
reason = "Paste sites, request catchers, tunnels and chat webhooks are common exfiltration sinks."
pattern = '''(pastebin\.com|paste\.ee|hastebin|transfer\.sh|file\.io|0x0\.st|ngrok(-free)?\.(io|app|dev)|trycloudflare\.com|webhook\.site|requestbin|pipedream\.net|beeceptor|interact\.sh|oast\.(fun|me|pro|site|live|online)|burpcollaborator|canarytokens|discord(app)?\.com/api/webhooks|api\.telegram\.org/bot|hooks\.slack\.com/services)'''

[[line_rules]]
id = "EX005"
atlas = ["AML.T0025"]
title = "Archive or encode the project for transfer"
category = "exfiltration"
weight = 25
reason = "Bundling the repo or home folder is a common exfiltration step."
pattern = '''\b(tar|zip|7z|compress-archive)\b[^\n]{0,60}(~|\$home|%userprofile%|\.ssh|\.aws|\.git\b|/home/|c:\\users)'''


# ── safety bypass / agent config tampering ────────────────────────────────

[[line_rules]]
id = "SB001"
atlas = ["AML.T0051.001", "AML.T0054"]
title = "Disable approvals or sandboxing"
category = "safety-bypass"
weight = 55
reason = "Removes the human-in-the-loop or sandbox protections of the agent."
pattern = '''(--dangerously-skip-permissions|--dangerously-bypass-approvals-and-sandbox|--yolo\b|--no-sandbox|--full-auto|approval[_-]?policy\s*[=:]\s*.?never|sandbox(_mode)?\s*[=:]\s*.?(danger-full-access|off|none|disabled|false)|bypasspermissions|\b(disable|turn\s+off|bypass|skip|deactivate|remove)\s+(the\s+|all\s+|any\s+)?(sandbox(ing)?|approvals?|permission\s+(prompts|checks)|confirmations?|safety\s+(checks|guards|rules)|guardrails))'''

[[line_rules]]
id = "SB002"
atlas = ["AML.T0051.001", "AML.T0054"]
title = "Auto-approve or act without confirmation"
category = "safety-bypass"
weight = 30
reason = "Tells the agent to proceed without asking."
pattern = '''\b(auto[- ]?approve|always\s+(allow|approve|accept|say\s+yes)|without\s+(asking|confirmation|approval|permission|prompting)|never\s+ask\s+(for\s+)?(permission|confirmation|approval))'''

[[line_rules]]
id = "CF001"
atlas = ["AML.T0081"]
title = "Modify agent configuration or MCP servers"
category = "agent-config-tamper"
weight = 40
reason = "Changing agent settings or adding MCP servers can grant new tools or remove limits."
pattern = '''(\.claude/settings(\.local)?\.json|\.codex/config\.toml|\.cursor/mcp\.json|\.vscode/(settings|mcp)\.json|\.gemini/settings\.json|claude_desktop_config\.json|\.mcp\.json|\bmcp_servers\b|\bmcpservers\b|\b(add|install|register|configure|enable)\s+(an?\s+|the\s+|this\s+|new\s+)?mcp\s+server|claude\s+mcp\s+add|allowedtools|permissions\.allow)'''

[[line_rules]]
id = "CF002"
atlas = ["AML.T0051.001", "AML.T0081"]
title = "Write to other agent instruction files"
category = "agent-config-tamper"
weight = 30
reason = "Spreading instructions into other agent files is how a planted file persists."
pattern = '''\b(write|modify|edit|update|append|overwrite|create|copy)\b[^\n]{0,50}\b(agents|claude|gemini|agent)\.md\b|\.cursorrules|copilot-instructions\.md'''

[[line_rules]]
id = "CF003"
atlas = ["AML.T0050", "AML.T0051.001"]
title = "Tamper with git safety"
category = "agent-config-tamper"
weight = 25
reason = "Force pushes, global git config changes or hook manipulation."
pattern = '''(git\s+push\s+[^\n]*(--force\b|-f\b)|git\s+config\s+--global|core\.hookspath|\.git/hooks/|--no-verify\b|git\s+remote\s+(add|set-url))'''


# ════════════════════════════════════════════════════════════════════════
# Detectors: the detection logic lives in src/analyzer.rs; the wording,
# weight and (where a detector uses one) the pattern live here.
# `weight_max` is the weight used when the finding is aggravated: HT001 when
# the comment also matches a line rule or a network command, UC003 as the cap
# for +5 per extra character.
# ════════════════════════════════════════════════════════════════════════

[[detectors]]
id = "EX010"
atlas = ["AML.T0057"]
title = "Credential access combined with network transfer"
category = "exfiltration"
weight = 75
reason = "A credential/secret reference sits within two lines of a network command or URL."

# ── hidden markdown / HTML ───────────────────────────────────────────────

[[detectors]]
id = "HT001"
atlas = ["AML.T0051.001", "AML.T0068"]
title = "Instructions hidden in an HTML comment"
category = "hidden-text"
weight = 35
weight_max = 55
reason = "HTML comments are invisible when the markdown is rendered but agents still read them."

[[detectors]]
id = "HT002"
atlas = ["AML.T0068"]
title = "Text hidden with inline CSS"
category = "hidden-text"
weight = 40
reason = "Styled to be invisible when rendered."
pattern = '''<[a-z][^>]*style\s*=\s*["'][^"']*(display\s*:\s*none|visibility\s*:\s*hidden|font-size\s*:\s*0|opacity\s*:\s*0(\.0+)?\s*[;"']|color\s*:\s*(white|#fff\b|#ffffff|transparent))'''

[[detectors]]
id = "HT003"
atlas = ["AML.T0068"]
title = "Markdown link-reference comment"
category = "hidden-text"
weight = 25
reason = "`[x]: # (...)` lines do not render; they can carry hidden text."
pattern = '''^\s*\[[^\]]*\]:\s*(#|<>)\s*[\(\x22']'''

# ── invisible Unicode ────────────────────────────────────────────────────

[[detectors]]
id = "UC001"
atlas = ["AML.T0068"]
title = "Hidden Unicode tag characters"
category = "hidden-text"
weight = 85
reason = "Tag characters are invisible but encode ASCII text that models read."

[[detectors]]
id = "UC002"
atlas = ["AML.T0068"]
title = "Bidirectional control characters"
category = "hidden-text"
weight = 50
reason = "Bidi controls make the displayed text differ from what the agent reads (Trojan Source)."

[[detectors]]
id = "UC003"
atlas = ["AML.T0068"]
title = "Zero-width / blank characters"
category = "hidden-text"
weight = 30
weight_max = 60
reason = "Invisible characters can split keywords to evade review or hide content."

[[detectors]]
id = "UC004"
atlas = ["AML.T0068"]
title = "Variation-selector payload"
category = "hidden-text"
weight = 60
reason = "Unusual variation selectors can encode arbitrary hidden bytes."

[[detectors]]
id = "UC005"
atlas = []
title = "Private-use characters"
category = "obfuscation"
weight = 15
reason = "Private-use code points have no standard meaning."

[[detectors]]
id = "UC006"
atlas = ["AML.T0068"]
title = "Control characters"
category = "obfuscation"
weight = 30
reason = "Control characters (including ANSI escapes) can hide or rewrite terminal output."

[[detectors]]
id = "UC007"
atlas = ["AML.T0068"]
title = "Mixed-script word (homoglyph)"
category = "obfuscation"
weight = 25
reason = "Cyrillic/Greek look-alike letters inside a Latin word can evade keyword review."

# ── encoded payloads ─────────────────────────────────────────────────────

[[detectors]]
id = "B64001"
atlas = ["AML.T0068"]
title = "Base64-encoded text"
category = "obfuscation"
weight = 30
reason = "Encoded text is unreadable to reviewers but trivially decoded by an agent."

[[detectors]]
id = "B64002"
atlas = []
title = "Opaque encoded blob"
category = "obfuscation"
weight = 15
reason = "Long binary-looking blob in an instruction file."

[[detectors]]
id = "HEX001"
atlas = ["AML.T0068"]
title = "Hex-encoded payload"
category = "obfuscation"
weight = 20
reason = "Long hex escape sequence."
pattern = '''((\\x[0-9a-f]{2}){16,}|\b[0-9a-f]{96,}\b)'''

# ── URLs and domains ─────────────────────────────────────────────────────

[[detectors]]
id = "URL001"
atlas = []
title = "Unknown domain"
category = "network"
weight = 8
reason = "Domain is not in analyzer.trusted_domains."

[[detectors]]
id = "URL002"
atlas = []
title = "URL to a raw IP address"
category = "exfiltration"
weight = 30
reason = "Legitimate docs rarely point at bare IPs."

[[detectors]]
id = "URL003"
atlas = []
title = "URL shortener"
category = "obfuscation"
weight = 25
reason = "Shorteners hide the real destination."
pattern = '''^(bit\.ly|tinyurl\.com|t\.co|goo\.gl|is\.gd|ow\.ly|buff\.ly|rebrand\.ly|cutt\.ly|shorturl\.at|rb\.gy|tiny\.cc|t\.ly)$'''

[[detectors]]
id = "URL004"
atlas = []
title = "Punycode domain"
category = "obfuscation"
weight = 30
reason = "Internationalized domains can impersonate well-known sites."

[[detectors]]
id = "URL005"
atlas = []
title = "URL with embedded user info"
category = "obfuscation"
weight = 30
reason = "`user@host` URLs can disguise the real destination."

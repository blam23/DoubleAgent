[package]
name = "doubleagent"
version = "0.1.0"
edition = "2021"
description = "Rogue AGENTS.md sentinel: finds, scores and reports malicious agent instruction files"
license = "MIT"
rust-version = "1.95"

[[bin]]
name = "doubleagent"
path = "src/main.rs"

[[bin]]
name = "doubleagent-gui"
path = "src/gui/doubleagent-gui.rs"

[[bin]]
name = "doubleagent-lsp"
path = "src/lsp/doubleagent-lsp.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "7.0.0"
eframe = "0.37.0"
globset = "0.4"
hex = "0.4"
ignore = "0.4"
notify = "8.2.0"
notify-rust = "4.18.2"
png = "0.18"
regex = "1"
rfd = "0.17.2"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
toml = "1.1.8"
tray-icon = "0.26.1"
ureq = { version = "3.5.0", features = ["json"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

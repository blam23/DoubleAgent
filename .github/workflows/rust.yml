name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libglib2.0-dev \
          libwayland-dev \
          wayland-protocols \
          pkg-config \
          build-essential \
          libatk1.0-dev \
          libpango1.0-dev \
          libcairo2-dev \
          libx11-dev \
          libxrandr-dev \
          libgdk-pixbuf-2.0-dev \
          libgdk-3.0-dev \
          libfontconfig1-dev \
          libssl-dev
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
